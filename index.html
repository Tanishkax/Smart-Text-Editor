<!DOCTYPE html>
<html>
<head>
    <title>Smart Text Editor</title>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f3ff;
            color: #28365b;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #4058a5;
            font-size: 36px;
        }

        textarea {
            width: 90%;
            max-width: 750px;
            height: 250px;
            padding: 15px;
            border: 2px solid #d5dcf5;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: white;
        }

        button {
            background-color: #527cf6;
            color: white;
            border: none;
            padding: 12px 22px;
            margin: 8px 4px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #314bba;
        }

        .stack-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 25px auto;
        }

        .stack-box {
            background-color: white;
            border: 2px solid #d5dcf5;
            border-radius: 12px;
            padding: 20px;
            width: 300px;
            box-sizing: border-box;
        }

        .stack-box h3 {
            color: #4058a5;
            margin-top: 0;
        }

        #undoItems, #redoItems {
            background-color: #f0f3ff;
            border-radius: 8px;
            padding: 10px;
            min-height: 35px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Smart Text Editor</h1>
    <p>My first website!</p>

    <textarea placeholder="Start typing here..."></textarea>
     <p>
    Words: <span id="wordCount">0</span>
    |
    Characters: <span id="charCount">0</span>
</p>
    <br><br>

 <button id="undoBtn">Undo</button>
<button id="redoBtn">Redo</button>
<button id="saveBtn">Save</button>
<button id="clearBtn">Clear</button>
<div class="stack-container">

    <div class="stack-box">
        <h3>Undo Stack</h3>
        <p>Stored States: <span id="undoCount">0</span></p>
        <div id="undoItems">Empty Stack</div>
    </div>

    <div class="stack-box">
        <h3>Redo Stack</h3>
        <p>Stored States: <span id="redoCount">0</span></p>
        <div id="redoItems">Empty Stack</div>
    </div>

</div>
</body>
<script>
    const editor = document.querySelector("textarea");

    const undoStack = [];
    const redoStack = [];

    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const saveBtn = document.getElementById("saveBtn");
    const clearBtn = document.getElementById("clearBtn");

    const undoCount = document.getElementById("undoCount");
    const redoCount = document.getElementById("redoCount");
    const undoItems = document.getElementById("undoItems");
    const redoItems = document.getElementById("redoItems");

    const wordCount = document.getElementById("wordCount");
    const charCount = document.getElementById("charCount");

    let previousText = editor.value;

    // Word aur character count update karo
    function updateTextCount() {
        const text = editor.value;

        const words = text.trim() === ""
            ? 0
            : text.trim().split(/\s+/).length;

        wordCount.textContent = words;
        charCount.textContent = text.length;
    }

    // Dono stacks ka status update karo
    function updateStackStatus() {
        undoCount.textContent = undoStack.length;
        redoCount.textContent = redoStack.length;

        undoItems.textContent = undoStack.length > 0
            ? undoStack.map((text, i) =>
                (i + 1) + ". " + (text || "(Empty text)")
              ).join("\n")
            : "Empty Stack";

        redoItems.textContent = redoStack.length > 0
            ? redoStack.map((text, i) =>
                (i + 1) + ". " + (text || "(Empty text)")
              ).join("\n")
            : "Empty Stack";

        undoBtn.disabled = undoStack.length === 0;
        redoBtn.disabled = redoStack.length === 0;

        updateTextCount();
    }

    // Jab user type kare
    editor.addEventListener("input", function () {
        if (editor.value !== previousText) {
            undoStack.push(previousText);
            previousText = editor.value;
            redoStack.length = 0;

            updateStackStatus();
        }
    });

    // Undo button
    undoBtn.addEventListener("click", function () {
        if (undoStack.length > 0) {
            redoStack.push(editor.value);
            editor.value = undoStack.pop();
            previousText = editor.value;

            updateStackStatus();
        }
    });

    // Redo button
    redoBtn.addEventListener("click", function () {
        if (redoStack.length > 0) {
            undoStack.push(editor.value);
            editor.value = redoStack.pop();
            previousText = editor.value;

            updateStackStatus();
        }
    });
// Keyboard shortcuts: Ctrl + Z and Ctrl + Y
    document.addEventListener("keydown", function (event) {
        if (event.ctrlKey && event.key.toLowerCase() === "z") {
            event.preventDefault();
            undoBtn.click();
        }

        if (event.ctrlKey && event.key.toLowerCase() === "y") {
            event.preventDefault();
            redoBtn.click();
        }
    });
    // Clear button
    clearBtn.addEventListener("click", function () {
    editor.value = "";
    previousText = "";

    undoStack.length = 0;
    redoStack.length = 0;

    updateStackStatus();
});
    // Save button
    saveBtn.addEventListener("click", function () {
        const blob = new Blob([editor.value], {
            type: "text/plain"
        });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "my-notes.txt";
        link.click();

        setTimeout(function () {
            URL.revokeObjectURL(link.href);
        }, 1000);
    });

    // Page load hote hi counts set karo
    updateStackStatus();
</script>
</html>
